description: >-
  A private measurement layer for PoCiSys GPU Runtime. Gateway forwards local
  AI responses unchanged while recording timing, model identity, token counts,
  failures, and body hashes. Prompt and response text are not retained. Use its
  dashboard to inspect recent requests, performance baselines, and clear
  attention reasons without exposing Ollama outside Umbrel.

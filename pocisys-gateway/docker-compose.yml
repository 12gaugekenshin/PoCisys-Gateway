version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: pocisys-gateway_server_1
      APP_PORT: 8719
      PROXY_AUTH_ADD: "true"

  data_init:
    image: ghcr.io/12gaugekenshin/pocisys-gateway:0.1.5
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - chown -R 10001:10001 /data
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${APP_DATA_DIR}/data:/data

  server:
    image: ghcr.io/12gaugekenshin/pocisys-gateway:0.1.5
    depends_on:
      data_init:
        condition: service_completed_successfully
    restart: on-failure
    init: true
    read_only: true
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      Gateway__ListenUrl: http://0.0.0.0:8719
      Gateway__BackendBaseUrl: http://pocisys-gpu-runtime_runtime_1:11434
      Gateway__ConnectionManaged: "true"
      Gateway__MaxRequestMegabytes: "8"
      Gateway__RequestTimeoutMinutes: "10"
      Gateway__LiveReceiptLimit: "500"
      Gateway__PersistentEvidenceEnabled: "false"
      Gateway__PersistentReceiptLimit: "5000"
      POCISYS_GATEWAY_DATA_DIR: /data
      DOTNET_EnableDiagnostics: "0"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    networks:
      default:
        aliases:
          - pocisys-gateway_server_1
          - pocisys-gateway-server-1
